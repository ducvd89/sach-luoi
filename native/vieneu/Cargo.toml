[package]
name = "sachnoi-vieneu"
version = "0.1.0"
edition = "2021"
description = "Chạy mô hình VieNeu-TTS trên máy, không cần Python"

[lib]
name = "sachnoi_vieneu"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Chuyển chữ sang âm vị — dùng lại lõi Rust của sea-g2p đã port sang Android.
sea-g2p-rs = { path = "../sea-g2p", default-features = false, features = ["ffi"] }

# ONNX Runtime. `load-dynamic` nghĩa là nạp libonnxruntime lúc chạy chứ không
# liên kết lúc build: cross-compile sang Android khỏi cần thư viện của Android
# lúc dựng, và bản .so của Microsoft đi kèm APK là dùng được ngay.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }

ndarray = "0.17"
rand = "0.8"

# Chính là thư viện Rust mà `tokenizers` bên Python bọc lại, nên tách token ra
# kết quả giống hệt. Bỏ các tính năng cần thư viện C để cross-compile cho gọn.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Engine VieNeu v2 (Qwen3 0.3B, trọng số GGUF Q4) chạy qua llama.cpp.
#
# Vì sao không dùng ONNX như v3: v2 chỉ phát hành safetensors và GGUF, không có
# bản ONNX nào. Mà kể cả có thì llama.cpp vẫn hợp hơn cho vòng lặp sinh từng
# token một — kernel ARM/x86 viết tay cho ma trận đã lượng tử, KV cache lớn dần
# là ca dùng chính của nó, và trọng số nạp bằng mmap nên nhiều worker lúc xuất
# file dùng chung một bản trong page cache thay vì mỗi bản một vùng nhớ riêng.
#
# Khai cho MỌI nền tảng, kể cả Android: `llama-cpp-sys-2` tự dựng llama.cpp bằng
# NDK khi target là *-linux-android, miễn là biết NDK nằm đâu. Nó tìm theo thứ
# tự ANDROID_NDK → ANDROID_NDK_ROOT → NDK_ROOT, rồi suy tiếp từ ANDROID_HOME;
# mức API lấy từ ANDROID_API_LEVEL hoặc ANDROID_PLATFORM. Đặt sẵn hai biến ấy
# trong `.cargo/config.toml` nên build thẳng `cargo build --target
# aarch64-linux-android` là chạy.
[dependencies.llama-cpp-2]
version = "0.1.154"

# Bộ mã hoá âm thanh cho việc xuất file — CHỈ cho máy tính.
#
# libopus và libmp3lame là mã C. Trên Windows chúng dựng sạch, còn biên dịch
# chéo sang Android thì audiopus_sys không mang theo mã nguồn libopus (nó đi tìm
# thư viện hệ thống qua pkg-config, target Android không có gì để tìm), và
# mp3lame-sys thì đụng stdint.h của NDK.
#
# Không phải sửa hai chỗ đó: Android có sẵn MediaCodec trong hệ điều hành, mã
# hoá được Opus và AAC mà không cần thư viện nào. Nên khai theo target — bản
# Android không kéo chúng vào, và cũng không phải nhồi ffmpeg vào bộ cài.
[target.'cfg(not(target_os = "android"))'.dependencies]
mp3lame-encoder = "0.2"
audiopus = "0.2"
ogg = "0.9"
# Thuần Rust, không FFI/thư viện C — không có gì để cross-compile, khác hẳn
# hai bộ mã hoá trên. Cho AAC vào Windows/macOS/Linux dễ như MP3.
rusty_aac = "0.1"
